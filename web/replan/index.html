<title>京王全駅巡回 再計算</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* 現地で片手で操作する再計算画面。上から「今の状況 → 計算 → 残りの行程 → 訪問済みの駅 → 設定」の 1 列 */
:root {
  --bg: #f4f5f2; --panel: #ffffff; --ink: #1b1f23; --muted: #626a70; --line: #dfe2dc;
  --accent: #0b6e69; --accent-ink: #ffffff; --accent-soft: #d9efec;
  --stamp: #c2410c; --stamp-soft: #fde8dc; --walk: #4d7c0f; --warn: #a16207;
  --done: #9aa3a8; --chip: #eef0ec;
  --font: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111416; --panel: #1a1e21; --ink: #e8ebed; --muted: #9aa3a8; --line: #2b3135;
    --accent: #4fc3b8; --accent-ink: #062b28; --accent-soft: #163633;
    --stamp: #fb923c; --stamp-soft: #3a2416; --walk: #a3d977; --warn: #facc15;
    --done: #5b646a; --chip: #23292c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111416; --panel: #1a1e21; --ink: #e8ebed; --muted: #9aa3a8; --line: #2b3135;
  --accent: #4fc3b8; --accent-ink: #062b28; --accent-soft: #163633;
  --stamp: #fb923c; --stamp-soft: #3a2416; --walk: #a3d977; --warn: #facc15;
  --done: #5b646a; --chip: #23292c; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); -webkit-tap-highlight-color: transparent; }
main { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 64px; display: grid; gap: 14px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
h1 { font-size: 19px; margin: 0; text-wrap: balance; }
.sync { font-size: 12px; color: var(--muted); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
.card h2 { font-size: 13px; margin: 0; color: var(--muted); letter-spacing: .06em; font-weight: 700; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
label.field { display: grid; gap: 4px; font-size: 12px; color: var(--muted); flex: 1 1 140px; min-width: 0; }
select, input[type="time"], input[type="number"] {
  font: inherit; font-size: 17px; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; width: 100%; min-height: 46px; font-variant-numeric: tabular-nums;
}
button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); padding: 10px 14px; min-height: 44px; }
button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; font-size: 17px; width: 100%; min-height: 54px; }
button.primary:disabled { opacity: .55; cursor: progress; }
.toggle { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--accent); }
.progress { height: 6px; background: var(--chip); border-radius: 99px; overflow: hidden; }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi { background: var(--bg); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.kpi b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 11px; color: var(--muted); }
.note { font-size: 12px; color: var(--muted); margin: 0; }
.warn { color: var(--warn); }
ol.legs { list-style: none; margin: 0; padding: 0; display: grid; }
ol.legs li { display: grid; grid-template-columns: 52px 1fr auto; gap: 4px 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
ol.legs li:first-child { border-top: 0; }
.t { font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 700; }
.t small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.what { min-width: 0; }
.what .to { font-weight: 700; }
.what .via { font-size: 12px; color: var(--muted); }
.what .via.walk { color: var(--walk); font-weight: 700; }
.badge { display: inline-grid; place-items: center; min-width: 26px; height: 22px; padding: 0 6px; border-radius: 99px; background: var(--stamp-soft); color: var(--stamp); font-size: 12px; font-weight: 700; margin-right: 6px; font-variant-numeric: tabular-nums; }
li.xfer .to { font-weight: 400; color: var(--muted); }
button.stamp { min-height: 38px; padding: 6px 10px; font-size: 13px; background: var(--stamp-soft); color: var(--stamp); border-color: transparent; font-weight: 700; }
.lines { display: grid; gap: 12px; }
.line h3 { font-size: 12px; margin: 0 0 6px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 36px; padding: 6px 10px; font-size: 14px; border-radius: 99px; background: var(--chip); border: 1px solid transparent; }
.chip[aria-pressed="true"] { background: var(--stamp-soft); color: var(--stamp); border-color: var(--stamp); font-weight: 700; }
.chip.ex { color: var(--done); text-decoration: line-through; }
.chip.here { outline: 2px solid var(--accent); outline-offset: 1px; }
details > summary { cursor: pointer; font-weight: 700; list-style: revert; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: transparent; min-height: 40px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.dwell { display: grid; grid-template-columns: 1fr 90px; gap: 6px 10px; align-items: center; font-size: 14px; }
.err { color: var(--stamp); font-size: 13px; white-space: pre-wrap; }
@media (prefers-reduced-motion: reduce) { .progress > i { transition: none; } }
</style>

<main>
  <header>
    <h1>京王全駅巡回 再計算</h1>
    <span class="sync" id="sync">記録: 端末内</span>
  </header>

  <section class="card" aria-labelledby="h-now">
    <h2 id="h-now">今の状況</h2>
    <div class="row">
      <label class="field">今いる駅<select id="cur"></select></label>
      <label class="field" style="flex:0 1 150px">時刻<input id="time" type="time" step="60"></label>
    </div>
    <div class="row">
      <button id="now" type="button">時刻を今にする</button>
      <label class="toggle"><input id="stamped" type="checkbox"> この駅の改札はもう出た（スタンプ済み）</label>
    </div>
    <button class="primary" id="go" type="button">残りのルートを計算</button>
    <div class="progress" aria-hidden="true"><i id="bar"></i></div>
    <p class="note" id="status">訪問済みの駅と今の状況から、残りの駅を回る最短ルートをこの端末で計算します。</p>
  </section>

  <section class="card" id="result" hidden aria-labelledby="h-res">
    <h2 id="h-res">残りの行程</h2>
    <div class="summary">
      <div class="kpi"><b id="k-end">--:--</b><span>完了</span></div>
      <div class="kpi"><b id="k-left">0</b><span>残りの駅</span></div>
      <div class="kpi"><b id="k-dur">0:00</b><span>残り時間</span></div>
    </div>
    <p class="note" id="res-note"></p>
    <ol class="legs" id="legs"></ol>
  </section>

  <section class="card" aria-labelledby="h-vis">
    <h2 id="h-vis">訪問済みの駅（タップで切り替え）</h2>
    <p class="note" id="vis-count"></p>
    <div class="lines" id="lines"></div>
  </section>

  <section class="card">
    <details>
      <summary>計算の条件</summary>
      <div style="display:grid;gap:14px;margin-top:12px">
        <div class="row">
          <span style="font-size:13px">ダイヤ</span>
          <div class="seg" role="group" aria-label="ダイヤ">
            <button type="button" data-dataset="regular">通常の土休日</button>
            <button type="button" data-dataset="race">東京競馬の開催日</button>
          </div>
        </div>
        <label class="toggle"><input id="opt-walk" type="checkbox"> 歩いたほうが早い区間は歩く（分速80m）</label>
        <label class="toggle"><input id="opt-maybe" type="checkbox"> 飛田給の臨時停車に備える（通過列車は1分遅れで計算）</label>
        <div class="row">
          <span style="font-size:13px">計算の精度</span>
          <div class="seg" role="group" aria-label="精度">
            <button type="button" data-beam="3000">標準</button>
            <button type="button" data-beam="1000">速い</button>
          </div>
        </div>
        <div>
          <p class="note" style="margin-bottom:6px">滞在を長めにとる駅（分）</p>
          <div class="dwell" id="dwell"></div>
        </div>
        <div class="row">
          <button type="button" id="edit-ex">除外する駅を編集</button>
          <span class="note" id="ex-note"></span>
        </div>
        <p class="note">改札の出入りは3分、改札を出ない乗換は1分（逆方向は+3分、新宿8分・明大前3分）。千歳烏山は北口、柴崎は南口を使う前提。座席指定の列車は使いません。</p>
        <button type="button" id="reset">訪問記録をリセット</button>
        <div class="err" id="err"></div>
      </div>
    </details>
  </section>
</main>

<script>
(() => {
  // ---- 定数・状態
  const DATASETS = { regular: { file: "data/regular.json", label: "通常の土休日（2026-12-12 のダイヤ）" }, race: { file: "data/race.json", label: "東京競馬の開催日（2026-10-10 のダイヤ）" } };
  const DEFAULTS = {
    dataset: "race", current: "keiotamacenter", time: "", stamped: false, visited: [],
    excluded: ["shinjuku", "keioinadazutsumi", "keiotamacenter", "shibuya", "shinsen", "shimokitazawa"],
    dwellAt: { kichijoji: 8, musashinodai: 14, bubaigawara: 6, takahatafudo: 6, takao: 20, keiokatakura: 20 },
    walk: true, maybeStop: true, beam: 3000,
  };
  const LS_KEY = "keio-replan-state";
  let state = loadLocal();
  let tt = null, ttFor = null, stationName = new Map(), trainById = new Map();
  let walkPairs = null;
  let editEx = false;
  let db = null, docRef = null, lastSaved = "";

  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, "0");
  const hm = (sec) => `${pad(Math.floor(sec / 3600) % 24)}:${pad(Math.floor(sec / 60) % 60)}`;
  const dur = (sec) => `${Math.floor(sec / 3600)}:${pad(Math.floor(sec / 60) % 60)}`;
  const toSec = (s) => { const [h, m] = s.split(":").map(Number); return h * 3600 + m * 60; };
  const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };

  function loadLocal() {
    try { const s = JSON.parse(localStorage.getItem(LS_KEY) || "null"); if (s) return { ...DEFAULTS, ...s }; } catch {}
    return structuredClone(DEFAULTS);
  }
  // 状態の保存: db（あれば）と端末内。変更があったときだけ、まとめて 1 回書く
  let saveTimer = 0;
  function save() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch {}
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveRemote, 600);
  }
  async function saveRemote() {
    if (!docRef) return;
    const body = JSON.stringify(state);
    if (body === lastSaved) return;
    try {
      await docRef.set({ ...state, updatedAt: new Date().toISOString() });
      lastSaved = body;
      $("sync").textContent = `記録: 保存済み ${nowHM()}`;
    } catch (e) {
      $("sync").textContent = "記録: 端末内のみ（保存できませんでした）";
    }
  }

  // ---- データ
  async function loadData() {
    if (ttFor === state.dataset && tt) return;
    $("status").textContent = "時刻表を読み込んでいます…";
    const text = await (await fetch(DATASETS[state.dataset].file)).text();
    tt = JSON.parse(text);
    tt._text = text;
    ttFor = state.dataset;
    stationName = new Map(tt.stations.map((s) => [s.id, s.name.replace(/（.*）$/, "")]));
    trainById = new Map(tt.trains.map((t) => [t.id, t]));
    if (!walkPairs) walkPairs = (await (await fetch("data/walk.json")).json()).pairs;
    $("status").textContent = `${DATASETS[state.dataset].label}を使います。`;
  }

  // ---- 描画
  function renderStations() {
    const cur = $("cur");
    cur.innerHTML = "";
    for (const r of tt.routes) {
      const g = document.createElement("optgroup");
      g.label = r.name;
      for (const s of r.stations) {
        if ([...cur.querySelectorAll("option")].some((o) => o.value === s.stationId)) continue;
        const o = document.createElement("option");
        o.value = s.stationId;
        o.textContent = stationName.get(s.stationId);
        g.append(o);
      }
      if (g.children.length) cur.append(g);
    }
    cur.value = state.current;
    const box = $("lines");
    box.innerHTML = "";
    const shown = new Set();
    for (const r of tt.routes) {
      const div = document.createElement("div");
      div.className = "line";
      const h = document.createElement("h3");
      h.textContent = r.name;
      const chips = document.createElement("div");
      chips.className = "chips";
      for (const s of r.stations) {
        if (shown.has(s.stationId)) continue;
        shown.add(s.stationId);
        const b = document.createElement("button");
        b.type = "button";
        b.className = "chip";
        b.dataset.id = s.stationId;
        b.textContent = stationName.get(s.stationId);
        chips.append(b);
      }
      if (chips.children.length) (div.append(h, chips), box.append(div));
    }
    renderChips();
  }
  function renderChips() {
    const ex = new Set(state.excluded), vis = new Set(state.visited);
    for (const b of $("lines").querySelectorAll(".chip")) {
      const id = b.dataset.id;
      b.classList.toggle("ex", ex.has(id));
      b.classList.toggle("here", id === state.current);
      b.setAttribute("aria-pressed", editEx ? String(ex.has(id)) : String(vis.has(id) && !ex.has(id)));
    }
    const total = tt.stations.filter((s) => !ex.has(s.id)).length;
    const done = state.visited.filter((id) => !ex.has(id)).length;
    $("vis-count").textContent = editEx
      ? "除外する駅を選んでいます（タップで切り替え）。終わったら「除外の編集を終える」を押してください。"
      : `訪問済み ${done} / ${total} 駅（除外 ${ex.size} 駅は対象外）`;
    $("edit-ex").textContent = editEx ? "除外の編集を終える" : "除外する駅を編集";
    $("ex-note").textContent = `除外: ${state.excluded.map((id) => stationName.get(id)).join("・") || "なし"}`;
  }
  function renderSettings() {
    for (const b of document.querySelectorAll("[data-dataset]")) b.setAttribute("aria-pressed", String(b.dataset.dataset === state.dataset));
    for (const b of document.querySelectorAll("[data-beam]")) b.setAttribute("aria-pressed", String(Number(b.dataset.beam) === state.beam));
    $("opt-walk").checked = state.walk;
    $("opt-maybe").checked = state.maybeStop;
    $("stamped").checked = state.stamped;
    $("time").value = state.time || nowHM();
    const d = $("dwell");
    d.innerHTML = "";
    for (const [id, min] of Object.entries(state.dwellAt)) {
      const l = document.createElement("label");
      l.textContent = stationName.get(id) || id;
      l.htmlFor = `dw-${id}`;
      const i = document.createElement("input");
      i.type = "number"; i.min = "3"; i.max = "120"; i.id = `dw-${id}`; i.value = String(min);
      i.addEventListener("change", () => { state.dwellAt[id] = Math.max(3, Number(i.value) || 3); save(); });
      d.append(l, i);
    }
  }

  // ---- 計算（Web Worker で重み 5 通りを並列に）
  const ALPHAS = [0.8, 1, 1.2, 1.5, 2];
  let pool = [], poolKey = "", reqId = 0;
  const pending = new Map();
  function call(w, msg) {
    return new Promise((resolve, reject) => {
      const id = ++reqId;
      pending.set(id, { resolve, reject });
      w.postMessage({ id, ...msg });
    });
  }
  function onMsg(e) {
    const p = pending.get(e.data.id);
    if (!p) return;
    pending.delete(e.data.id);
    e.data.ok ? p.resolve(e.data) : p.reject(new Error(e.data.error));
  }
  function solverConfig(start, exclude) {
    return {
      start, exclude, dwellMin: 3, xferMin: 1, allowReserved: false, beam: state.beam, branch: 10,
      xferAt: { shinjuku: 8, meidaimae: 3 }, xferReverseMin: 3,
      maybeStop: state.maybeStop ? { tobitakyu: 1 } : {},
      walk: state.walk ? walkPairs : undefined, walkSpeed: 80, walkFactor: 1.03, walkExitMin: 1,
      dwellAt: state.dwellAt,
      platformPenalty: { chitosekarasuyama: { down: 3 }, shibasaki: { up: 2 } },
      alphas: ALPHAS,
    };
  }
  async function ensurePool(cfg) {
    const key = JSON.stringify([state.dataset, cfg]);
    if (key === poolKey && pool.length) return;
    for (const w of pool) w.terminate();
    const n = Math.max(1, Math.min(ALPHAS.length, (navigator.hardwareConcurrency || 4) - 1));
    pool = Array.from({ length: n }, () => { const w = new Worker("worker.js", { type: "module" }); w.onmessage = onMsg; return w; });
    await Promise.all(pool.map((w) => call(w, { init: { data: tt._text, cfg } })));
    poolKey = key;
  }

  async function compute() {
    $("err").textContent = "";
    $("go").disabled = true;
    $("bar").style.width = "4%";
    try {
      await loadData();
      const T = toSec($("time").value || nowHM());
      const cur = state.current;
      const ex = new Set(state.excluded);
      // 訪問済み・除外を対象から外す。今いる駅でまだ改札を出ていないなら、ここで出てから出発する
      const visited = new Set(state.visited);
      const firstHere = !state.stamped && !ex.has(cur) && !visited.has(cur);
      const exclude = [...new Set([...state.excluded, ...visited, cur])];
      const dwellHere = (state.dwellAt[cur] ?? 3) * 60;
      // t0 = 次の列車に乗れる時刻。改札を出た直後なら改札からホームまで 1 分、まだならここで滞在してから
      const t0 = firstHere ? T + dwellHere : T + 60;
      const left = tt.stations.filter((s) => !exclude.includes(s.id)).length;
      if (left === 0) { showDone(T, firstHere); return; }
      const cfg = solverConfig(cur, exclude);
      $("status").textContent = "計算の準備をしています…";
      await ensurePool(cfg);
      $("status").textContent = `計算中（残り ${left} 駅）…`;
      let done = 0;
      const started = performance.now();
      const results = await Promise.all(ALPHAS.map(async (alpha, i) => {
        const r = await call(pool[i % pool.length], { beam: { t0, alpha } });
        done++;
        $("bar").style.width = `${10 + (done / ALPHAS.length) * 85}%`;
        return r.result;
      }));
      // 同じ完了時刻なら重みの順で先の結果（PC の CLI と同じ選び方）
      const best = results.reduce((a, b) => (!a ? b : !b ? a : b.end < a.end ? b : a), null);
      if (!best || !isFinite(best.end)) throw new Error("今日の運行時間内に残りの駅を回りきれません。条件を見直してください。");
      const d = await call(pool[0], { describe: { order: best.order, t0 } });
      showResult({ T, t0, best, legs: d.legs, firstHere, left, ms: performance.now() - started });
      $("bar").style.width = "100%";
    } catch (e) {
      $("err").textContent = String(e.message || e);
      $("status").innerHTML = `<span class="warn">計算できませんでした: ${escapeHtml(String(e.message || e))}</span>`;
    } finally {
      $("go").disabled = false;
      setTimeout(() => ($("bar").style.width = "0"), 800);
    }
  }
  const escapeHtml = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  function showDone(T, firstHere) {
    $("result").hidden = false;
    $("k-end").textContent = hm(T + (firstHere ? 180 : 0));
    $("k-left").textContent = firstHere ? "1" : "0";
    $("k-dur").textContent = "0:00";
    $("res-note").textContent = firstHere ? "この駅で改札を出れば、すべての駅を回り終えます。" : "すべての駅を回り終えています。";
    $("legs").innerHTML = "";
    $("status").textContent = "計算しました。";
  }

  let lastPlan = null;
  function showResult(p) {
    lastPlan = p;
    $("result").hidden = false;
    $("k-end").textContent = hm(p.best.end);
    $("k-left").textContent = String(p.left + (p.firstHere ? 1 : 0));
    $("k-dur").textContent = dur(p.best.end - p.T);
    $("res-note").textContent = `${DATASETS[state.dataset].label}。計算 ${(p.ms / 1000).toFixed(1)} 秒。` +
      (state.walk ? "徒歩の区間は Google マップでも確かめてください。" : "");
    const ol = $("legs");
    ol.innerHTML = "";
    if (p.firstHere) ol.append(row(p.T, null, state.current, "で改札を出る（スタンプ）", "", 1, state.current));
    let n = p.firstHere ? 1 : 0;
    for (const l of p.legs) {
      const t = l.train === "walk" ? null : trainById.get(l.train);
      const via = l.train === "walk"
        ? `徒歩 ${Math.round((l.arr - l.dep) / 60)}分`
        : `${t.direction === "down" ? "下り" : "上り"} ${t.trainType} ${t.number}（${t.destination}行）`;
      if (l.visit) n++;
      ol.append(row(l.dep, l.arr, l.to, l.visit ? null : "乗換", via, l.visit ? n : 0, l.from, l.train === "walk"));
    }
    $("status").textContent = "計算しました。改札を出たら、その行の「押した」を押してください（次の再計算の出発点になります）。";
  }
  function row(dep, arr, to, label, via, visitNo, from, walk) {
    const li = document.createElement("li");
    if (!visitNo) li.className = "xfer";
    const tm = document.createElement("div");
    tm.className = "t";
    tm.innerHTML = arr == null ? hm(dep) : `${hm(arr)}<small>${hm(dep)}発</small>`;
    const what = document.createElement("div");
    what.className = "what";
    const toEl = document.createElement("div");
    toEl.className = "to";
    if (visitNo) { const b = document.createElement("span"); b.className = "badge"; b.textContent = String(visitNo); toEl.append(b); }
    toEl.append(document.createTextNode(label && !via ? `${stationName.get(to)} ${label}` : `${stationName.get(from)} → ${stationName.get(to)}${label ? `（${label}）` : ""}`));
    what.append(toEl);
    if (via) { const v = document.createElement("div"); v.className = "via" + (walk ? " walk" : ""); v.textContent = via; what.append(v); }
    li.append(tm, what);
    if (visitNo) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "stamp";
      b.textContent = state.visited.includes(to) ? "済み" : "押した";
      b.addEventListener("click", () => markStamped(to, b));
      li.append(b);
    } else li.append(document.createElement("span"));
    return li;
  }
  // 「押した」: その駅を訪問済みにし、今いる駅・時刻をそこにする（スタンプ済み）
  function markStamped(id, btn) {
    if (!state.visited.includes(id)) state.visited.push(id);
    state.current = id;
    state.stamped = true;
    state.time = "";
    btn.textContent = "済み";
    $("cur").value = id;
    $("stamped").checked = true;
    $("time").value = nowHM();
    renderChips();
    save();
  }

  // ---- 入力
  $("cur").addEventListener("change", (e) => { state.current = e.target.value; state.stamped = state.visited.includes(state.current); $("stamped").checked = state.stamped; renderChips(); save(); });
  $("time").addEventListener("change", (e) => { state.time = e.target.value; save(); });
  $("now").addEventListener("click", () => { state.time = ""; $("time").value = nowHM(); save(); });
  $("stamped").addEventListener("change", (e) => {
    state.stamped = e.target.checked;
    if (state.stamped && !state.visited.includes(state.current) && !state.excluded.includes(state.current)) state.visited.push(state.current);
    renderChips(); save();
  });
  $("go").addEventListener("click", compute);
  $("lines").addEventListener("click", (e) => {
    const b = e.target.closest(".chip");
    if (!b) return;
    const id = b.dataset.id;
    const list = editEx ? state.excluded : state.visited;
    const i = list.indexOf(id);
    i >= 0 ? list.splice(i, 1) : list.push(id);
    renderChips(); save();
  });
  $("edit-ex").addEventListener("click", () => { editEx = !editEx; renderChips(); });
  for (const b of document.querySelectorAll("[data-dataset]")) b.addEventListener("click", async () => { state.dataset = b.dataset.dataset; renderSettings(); save(); await loadData(); });
  for (const b of document.querySelectorAll("[data-beam]")) b.addEventListener("click", () => { state.beam = Number(b.dataset.beam); renderSettings(); save(); });
  $("opt-walk").addEventListener("change", (e) => { state.walk = e.target.checked; save(); });
  $("opt-maybe").addEventListener("change", (e) => { state.maybeStop = e.target.checked; save(); });
  let resetArmed = false;
  $("reset").addEventListener("click", () => {
    if (!resetArmed) { resetArmed = true; $("reset").textContent = "もう一度押すとリセットします"; setTimeout(() => { resetArmed = false; $("reset").textContent = "訪問記録をリセット"; }, 4000); return; }
    resetArmed = false;
    state.visited = []; state.stamped = false; state.current = DEFAULTS.current; state.time = "";
    $("reset").textContent = "訪問記録をリセット";
    $("cur").value = state.current; renderSettings(); renderChips(); save();
    $("result").hidden = true;
  });

  // ---- 起動
  (async () => {
    try {
      await loadData();
      renderStations();
      renderSettings();
    } catch (e) {
      $("err").textContent = "時刻表を読み込めませんでした: " + (e.message || e);
    }
    // db（あれば）から記録を読む。以後の変更は db にも保存する
    try {
      db = await window.claude?.use?.("db");
      if (db) {
        docRef = db.doc("rally/state");
        const snap = await docRef.get();
        if (snap.exists) {
          const remote = snap.data();
          state = { ...DEFAULTS, ...remote };
          delete state.updatedAt;
          lastSaved = JSON.stringify(state);
          try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch {}
          await loadData();
          renderStations(); renderSettings();
          $("sync").textContent = `記録: 読み込み済み ${remote.updatedAt ? hm(toSec(new Date(remote.updatedAt).toTimeString().slice(0, 5))) : ""}`;
        } else {
          $("sync").textContent = "記録: 保存できます";
        }
      }
    } catch {
      $("sync").textContent = "記録: 端末内のみ";
    }
  })();
})();
</script>
